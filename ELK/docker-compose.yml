version: '3.8'

services:
  elasticsearch:
    image: elasticsearch:9.5.5
    container_name: elasticsearch
    volumes:
      - ./Elasticsearch/config.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - es_data:/usr/share/elasticsearch/data  # Именованный volume защитит от ошибок прав доступа (AccessDenied)
    environment:
      ES_JAVA_OPTS: "-Xmx300m -Xms300m"
      ELASTIC_PASSWORD: "123123"
      discovery.type: single-node
      xpack.security.enabled: "false" # Отключаем SSL для простого локального запуска (иначе Logstash/Kibana не подключатся без сертификатов)
    networks:
      - elk
    ports:
      - "9200:9200"
      - "9300:9300"

  logstash:
    image: logstash:9.5.5
    container_name: logstash
    volumes:
      - ./Logstash/config.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      LS_JAVA_OPTS: "-Xmx512m -Xms512m"
    ports:
      - "5044:5044"
      - "5000:5000"
      - "9600:9600"
    networks:
      - elk
    depends_on:
      - elasticsearch

  kibana:
    image: kibana:9.5.5
    container_name: kibana
    depends_on:
      - elasticsearch
    volumes:
      - ./Kibana/config.yml:/usr/share/kibana/config/kibana.yml:ro
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200 # Явно указываем Kibana внутренний Docker-адрес Elasticsearch
    networks:
      - elk
    ports:
      - "5601:5601"

volumes:
  es_data:
    driver: local

networks:
  elk:
    driver: bridge
